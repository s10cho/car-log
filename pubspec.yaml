name: car_log
description: "개인 차량의 유지보수 기록을 빠르게 남기고 확인하는 앱."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.13.3

dependencies:
  drift: ^2.31.0
  drift_flutter: ^0.3.1
  file_picker: ^12.3.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_scene: ^0.23.0
  flutter_secure_storage: ^11.1.0
  flutter_timezone: ^5.1.0
  go_router: ^18.0.1
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  logging: ^1.3.0
  meta: ^1.19.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  timezone: ^0.11.1
  uuid: ^4.6.0
  vector_math: ^2.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/models/

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android's adaptive icon crops the outer third, so the foreground is the car
  # alone, inset, over the brand colour taken from the source image.
  adaptive_icon_background: "#01609E"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
