name: Distribute Android

# Manual only. Every push distributing a build would ping testers constantly,
# and App Distribution releases are visible to real people.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 릴리스 노트 (비우면 최신 커밋 제목)
        required: false
        type: string

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Unlock signing material
        # The upload keystore and its password live in the repository encrypted
        # with git-crypt; without this the build would fall back to the debug
        # key and produce an APK testers could never update from.
        run: |
          sudo apt-get update && sudo apt-get install -y git-crypt
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt.key
          git-crypt unlock /tmp/git-crypt.key
          rm -f /tmp/git-crypt.key

      - name: Write service account key
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 -d > "$RUNNER_TEMP/sa.json"

      - run: flutter pub get
      - run: npm install -g firebase-tools

      - name: Build and distribute
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          RELEASE_NOTES: ${{ inputs.notes }}
        run: ./tool/distribute_android.sh

      - name: Remove the service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
